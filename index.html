<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linux Commands - Christian Cerrud</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <div class="container">
        <div class="logo"><i class="fab fa-linux"></i> LINUX COMMANDS</div>

        <div class="controls">
          <input
            type="text"
            id="searchInput"
            placeholder="Rechercher..."
            onkeyup="filterContent()"
          />
          <select id="langSelect" onchange="renderApp()">
            <option value="fr">Français</option>
            <option value="es">Español</option>
            <option value="en">English</option>
          </select>
        </div>

        <nav>
          <ul>
            <li><a href="#presentation" id="nav_pres">Présentation</a></li>
            <li><a href="#install" id="nav_install">Install</a></li>
            <li><a href="#files" id="nav_files">Fichiers</a></li>
            <li><a href="#users" id="nav_users">Utilisateurs</a></li>
            <li><a href="#groups" id="nav_groups">Groupes</a></li>
            <li><a href="#server" id="nav_server">Serveur</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section id="presentation">
        <div class="intro-box">
          <h2 id="title_pres">Présentation</h2>
          <p id="desc_pres">
            Linux® est un système d'exploitation Open Source...
          </p>
        </div>
      </section>

      <section id="install">
        <h2 class="section-title" id="title_install">
          Installation et Programmes
        </h2>
        <div class="grid" id="container-install"></div>
      </section>

      <section id="files">
        <h2 class="section-title" id="title_files">Fichiers et Répertoires</h2>
        <div class="grid" id="container-files"></div>
      </section>

      <section id="users">
        <h2 class="section-title" id="title_users">Utilisateurs</h2>
        <div class="grid" id="container-users"></div>
      </section>

      <section id="groups">
        <h2 class="section-title" id="title_groups">Groupes</h2>
        <div class="grid" id="container-groups"></div>
      </section>

      <section id="server">
        <h2 class="section-title" id="title_server">Serveur & Réseau</h2>
        <div class="grid" id="container-server"></div>
      </section>
    </main>

    <footer>&copy; 2025 EasyUnixWeb - Christian Cerrud.</footer>

    <script src="script.js"></script>
  </body>
</html>
